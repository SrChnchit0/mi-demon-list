<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demon List</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00adb5;
      --text-color: #eeeeee;
      --text-muted: #888888;
      --border-color: #333333;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    nav button {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      margin-left: 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    nav button.btn-primary {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex; justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
  <script>var vConsole = new VConsole();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>Demon List</h1>
    <nav>
      <button onclick="showSection('levels')">Niveles</button>
      <button onclick="showSection('leaderboard')">Leaderboard</button>
      <button onclick="showSection('submit')">Subir Récord</button>
      <button onclick="showSection('rules')">Reglas</button>
      <button id="auth-btn" class="btn-primary" onclick="openAuthModal()">Iniciar Sesión</button>
    </nav>
  </header>

  <main>
    <section id="sec-levels">
      <h2>Top Demon Levels</h2>
      <div id="levels-container">
        <p style="color: var(--text-muted);">Cargando niveles desde Supabase...</p>
      </div>
    </section>

    <section id="sec-leaderboard" style="display: none;">
      <h2>Tabla de Clasificación</h2>
      <div id="leaderboard-container"><p>Sin récords aún.</p></div>
    </section>

    <section id="sec-submit" style="display: none;">
      <h2>Enviar Récord</h2>
      <p>Inicia sesión para poder enviar récords.</p>
    </section>

    <section id="sec-rules" style="display: none;">
      <h2>Reglas de la Lista</h2>
      <ul>
        <li>Clicks / taps audibles obligatorios.</li>
        <li>No hacks o modificadores de velocidad.</li>
      </ul>
    </section>
  </main>

  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 id="modal-title">Iniciar Sesión</h2>
      <form onsubmit="handleAuth(event)">
        <input type="email" id="auth-email" placeholder="Correo" required style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <input type="password" id="auth-password" placeholder="Contraseña" required style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <button type="submit" style="width: 100%; padding: 10px; background: var(--accent-color); color: white; border: none; border-radius: 4px;">Entrar</button>
      </form>
      <button onclick="closeAuthModal()" style="margin-top: 10px; background: transparent; color: #888; border: none;">Cerrar</button>
    </div>
  </div>

  <script>
    console.log("Iniciando script principal...");
    const SUPABASE_URL = "https://jdvgdgiomrbmlxvvjvhd.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkdmdkZ2lvbXJibWx4dnZqdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDY5ODQsImV4cCI6MjEwNjEyMjk4NH0.N842TjW2BF6bjk6vf5mL3LJNCP6PPu3Z_PSGKlnd2EI";

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log("Supabase cliente inicializado correctamente.");
      }
    } catch (e) {
      console.error("Error iniciando Supabase:", e);
    }

    function openAuthModal() {
      document.getElementById("auth-modal").style.display = "flex";
    }

    function closeAuthModal() {
      document.getElementById("auth-modal").style.display = "none";
    }

    function showSection(sec) {
      ["levels", "leaderboard", "submit", "rules"].forEach(s => {
        const el = document.getElementById(`sec-${s}`);
        if (el) el.style.display = (s === sec) ? "block" : "none";
      });
    }

    async function loadLevels() {
      const container = document.getElementById("levels-container");
      if (!container) return;

      if (!supabaseClient) {
        container.innerHTML = "<p style='color: red;'>Error de conexión con la librería de Supabase.</p>";
        return;
      }

      try {
        const { data: levels, error } = await supabaseClient.from("levels").select("*").order("position", { ascending: true });
        
        if (error) {
          console.error("Error de la BD:", error);
          container.innerHTML = `<p style="color: red;">Error BD: ${error.message}</p>`;
          return;
        }

        if (!levels || levels.length === 0) {
          container.innerHTML = "<p style='color: var(--text-muted);'>No hay niveles agregados en la tabla 'levels' de Supabase.</p>";
          return;
        }

        container.innerHTML = levels.map(l => `
          <div style="background: var(--card-bg); padding: 12px; margin-bottom: 8px; border-radius: 6px;">
            <strong style="color: var(--accent-color);">#${l.position} - ${l.name}</strong>
            <p style="margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted);">Creador: ${l.creator || 'Desconocido'}</p>
          </div>
        `).join("");
      } catch (err) {
        console.error("Error al cargar niveles:", err);
        container.innerHTML = "<p style='color: red;'>Excepción al conectar con la base de datos.</p>";
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Error: " + error.message);
      else {
        alert("¡Sesión iniciada!");
        closeAuthModal();
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      console.log("DOM Cargado. Cargando datos...");
      loadLevels();
    });
  </script>
</body>
</html>
